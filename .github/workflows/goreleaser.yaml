name: release

on:
  push:
    tags:
      - "v*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # Every FORGEJO_* key the publishers template on must exist here: GoReleaser's
      # `{{ or .Env.X "default" }}` rescues an empty value, but a missing key is a
      # hard template error.
      FORGEJO_BASE_URL: https://code.knabel.dev
      FORGEJO_OWNER: zirric-lang
      FORGEJO_USER: code-butler
      FORGEJO_ARCH_REPO: extras
      FORGEJO_ALPINE_BRANCH: v3.23
      FORGEJO_ALPINE_REPO: main
      FORGEJO_DEBIAN_DIST: trixie
      FORGEJO_DEBIAN_COMPONENT: main
      CONTAINER_REGISTRY: code.knabel.dev
      CONTAINER_OWNER: zirric-lang
      CONTAINER_IMAGE: zirric

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Forgejo container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ secrets.FG_USER }}
          password: ${{ secrets.FG_TOKEN }}

      - name: Determine release notes file
        id: release-notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip any prerelease suffix (e.g. v0.1.0-beta.0 -> v0.1.0)
          VERSION=$(echo "$TAG" | sed 's/^\(v[0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
          echo "file=docs/changelog/${VERSION}.md" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          # Workaround for Debian registry race: serialize tasks/artifacts.
          args: release --clean --parallelism 1 --release-notes=${{ steps.release-notes.outputs.file }}
        env:
          # Forgejo/Gitea release publishing
          GITEA_TOKEN: ${{ secrets.FG_TOKEN}}
          GITHUB_TOKEN: ""

          # The FORGEJO_* names the publishers read come from this job's own env: block.
          # They are NOT read from repository variables, because Forgejo reserves the
          # FORGEJO_, GITHUB_ and GITEA_ prefixes for variables and secrets alike — a
          # `vars.FORGEJO_ALPINE_BRANCH` resolves to the empty string, which would
          # override the job env here and hand .goreleaser.yaml's `or` fallback
          # (v3.20, bookworm) instead of the values set above.

          FORGEJO_USER: ${{ secrets.FG_USER }}
          FORGEJO_TOKEN: ${{ secrets.FG_TOKEN }}

          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CONTAINER_OWNER: ${{ vars.CONTAINER_OWNER }}
          CONTAINER_IMAGE: ${{ vars.CONTAINER_IMAGE }}
