# Runs the stdlib tests under _tasks/test.zirr against the built zirric binary.
# See: https://github.com/bats-core/bats-core

name: Zirric StdLib

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Build zirric
        run: go build -o zirric ./cmd/zirric

      - name: Check formatting
        run: ./zirric fmt --check .

      - name: Run CLI tests
        run: ./zirric task run test
