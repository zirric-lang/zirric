version: "3"

vars:
  VERSION_PKG: github.com/metal-stack/v
  # The nearest tag, not the commit distance: version:sync writes this into the Cavefile, which a version that moved with every commit would rewrite each time.
  VERSION:
    sh: git describe --tags --abbrev=0 2>/dev/null || echo devel
  REVISION:
    sh: git describe --long --all --dirty 2>/dev/null || echo unknown
  GIT_SHA1:
    sh: git rev-parse --short=8 HEAD 2>/dev/null || echo unknown
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -X {{.VERSION_PKG}}.Version={{.VERSION}}
    -X {{.VERSION_PKG}}.Revision={{.REVISION}}
    -X {{.VERSION_PKG}}.GitSHA1={{.GIT_SHA1}}
    -X {{.VERSION_PKG}}.BuildDate={{.BUILD_DATE}}

includes:
  docs:
    taskfile: ./tasks/docmd/Taskfile.yml
    dir: ./tasks/docmd
  ci:
    taskfile: ./.github/Taskfile.yml
    dir: ./

tasks:
  build:
    desc: Build all Go packages
    deps:
      - version:sync
    run: when_changed
    method: timestamp
    sources:
      - "**/*.go"
      - "**/*.zirr"
      # version:sync writes VERSION into the Cavefile, and the same VERSION is stamped into the binary.
      - Cavefile
      - exclude: examples/
      - exclude: _tasks/
      - exclude: "**/_t"
      - go.mod
      - go.sum
    generates:
      - zirric
    # A changed VERSION is no file change, so the fingerprint above cannot see it.
    status:
      - test "$(./zirric version 2>/dev/null | cut -d' ' -f1)" = "{{.VERSION}}"
    cmds:
      - go build -v ./...
      - go build -v -ldflags "{{.LDFLAGS}}" -o zirric ./cmd/zirric

  version:sync:
    desc: Write the build's version into the Cavefile, so the package and the binary agree
    run: once
    silent: true
    cmds:
      # Moved into place rather than written over: `> Cavefile` truncates first, and the Cavefile cannot be regenerated from anything else.
      - |
        tmp="$(mktemp ./Cavefile.XXXXXX)"
        trap 'rm -f "$tmp"' EXIT
        sed \
          -e 's|^@cave\.Version(".*")$|@cave.Version("{{.VERSION}}")|' \
          -e 's|^@cave\.LanguageVersion(".*")$|@cave.LanguageVersion("={{.VERSION}}")|' \
          Cavefile > "$tmp"
        if ! cmp -s "$tmp" Cavefile; then
          chmod --reference=Cavefile "$tmp" 2>/dev/null || chmod 644 "$tmp"
          mv "$tmp" Cavefile
          echo "Cavefile version set to {{.VERSION}}"
        fi

  release:prepare:
    desc: Prepare a release, e.g. `task release:prepare VERSION=v0.1.0` (tag it afterwards)
    cmds:
      - task: version:sync

  test:
    desc: Run all tests (Go + CLI)
    cmds:
      - task: test:go
      - task: test:cli
      - task: test:stdlib

  test:go:
    desc: Run all Go tests
    sources:
      - "**/*.go"
      - "**/*.zirr"
      - exclude: Cavefile
      - exclude: examples/
      - exclude: _tasks/
      - go.mod
      - go.sum
    cmds:
      - go test ./... -race

  test:cli:
    desc: Run CLI integration tests (bats)
    run: when_changed
    method: timestamp
    deps:
      - build
    sources:
      - testing/
      - zirric
    cmds:
      - bats testing

  test:stdlib:
    desc: Run Zirric Stdlib tests
    run: always
    method: timestamp
    deps:
      - build
    sources:
      - zirric
      - "**/*.zirr"
      - Cavefile
    cmds:
      - ./zirric test

  gen:golden:
    desc: Regenerate formatter golden files
    cmds:
      - go test ./pkg/codefmt -update

  bench:
    desc: Run all Benchmarks
    sources:
      - "**/*.go"
      - "**/*.zirr"
      - go.mod
      - go.sum
    cmds:
      - go test ./... -count=1 -bench=.

  fmt:
    desc: Format
    deps:
      - build
    cmds:
      - gofmt -w .
      - dprint fmt --config dprint.json
      - ./zirric fmt .

  check:
    desc: Full validation (format, vet, build, test)
    deps:
      - build
    cmds:
      - gofmt -l .
      - dprint check --config dprint.json
      - ./zirric fmt --check .
      - golangci-lint run
      - go vet ./...
      - goreleaser check
      - go build -v ./...
      - go test ./...

  goreleaser:snapshot:
    desc: Build GoReleaser snapshot artifacts
    cmds:
      - goreleaser build --snapshot --clean
